repos:
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        name: Check editorconfig rules
        alias: ec
  - repo: https://github.com/managanemeke/sloc-sensor
    rev: 0.2.0
    hooks:
      - id: sloc-sensor
        name: Check commit rules
        alias: cm
        args: ["--limit", "26"]
  - repo: local
    hooks:
      - id: ts-style
        name: Check eslint rules
        alias: es
        language: system
        entry: node node_modules/eslint/bin/eslint.js
        args: [--max-warnings=0, --]
        files: '\.[cm]?[jt]sx?$'
